name: Release image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}
  BUILDKIT_HOST: tcp://buildkitd.buildkit.svc.cluster.local:1234

jobs:
  publish:
    runs-on: k8s-runners
    container:
      image: moby/buildkit:v0.33.0-ubuntu
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and push release image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          umask 077
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
          # BuildKit looks up Docker Hub credentials using its legacy index URL.
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$AUTH" > "$DOCKER_CONFIG/config.json"

          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=./build \
            --opt filename=Dockerfile \
            --opt build-arg:VERSION="${GITHUB_REF_NAME}" \
            --opt build-arg:COMMIT_HASH="${GITHUB_SHA}" \
            --opt build-arg:DATETIME="$(date -u +%FT%TZ)" \
            --output "type=image,name=${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME},push=true"
