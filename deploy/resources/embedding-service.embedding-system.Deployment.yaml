apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: embedding-system
  labels:
    app.kubernetes.io/name: embedding-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: embedding-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embedding-system
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: embedding-service
          image: embedding-service-image
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          env:
            - name: LOGGER_LEVEL
              value: info
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: SERVER_API_PORT
              value: "8000"
            - name: SERVER_HEALTHCHECK_PORT
              value: "8081"
            - name: SERVER_METRICS_PORT
              value: "9090"
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
            - name: healthcheck
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: healthcheck
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: healthcheck
            periodSeconds: 10
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
